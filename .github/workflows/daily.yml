name: daily-bhavcopy

on:
  schedule:
    # 14:30 UTC = 20:00 IST, Mon-Fri. NSE bhavcopy lands ~18:00 IST,
    # BSE ~18:30 IST. 20:00 IST gives a 90-min buffer in case the
    # archives endpoint lags or NSE delays publication.
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Trading date YYYY-MM-DD (defaults to today UTC→IST)'
        required: false
        default: ''
      from:
        description: 'Backfill start YYYY-MM-DD (with `to`; overrides `date`)'
        required: false
        default: ''
      to:
        description: 'Backfill end YYYY-MM-DD inclusive'
        required: false
        default: ''
      snapshots:
        description: 'Snapshot JSON years to export: current (default) or all (one-time seed)'
        required: false
        default: 'current'

concurrency:
  group: daily-bhavcopy
  cancel-in-progress: false

# Two jobs on purpose:
#   prices  - fetch today's bhavcopy, fold into the year rollup, publish.
#             Core product. Must be green every trading day.
#   derived - corp actions, symbol history, adjusted prices, metrics.
#             Rebuilt from full history, published from its own dir.
# A derived failure never blocks prices, but it DOES fail the run so
# GitHub emails on it. No continue-on-error anywhere except the flaky
# NSE corp-actions website fetch, which falls back to the actions
# history already on R2.

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      date: ${{ steps.date.outputs.value }}
      year: ${{ steps.year.outputs.value }}
      traded: ${{ steps.traded.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pipeline
        run: pip install -e .

      - name: Resolve trading date (IST)
        # With from/to set, `date` becomes the range end for labels.
        id: date
        run: |
          if [ -n "${{ github.event.inputs.to }}" ]; then
            D="${{ github.event.inputs.to }}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            D="${{ github.event.inputs.date }}"
          else
            D=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          fi
          echo "value=$D" >> "$GITHUB_OUTPUT"
          echo "Trading date: $D"

      - name: Resolve current year (IST)
        id: year
        run: echo "value=$(TZ=Asia/Kolkata date +%Y)" >> "$GITHUB_OUTPUT"

      - name: Fetch NSE+BSE
        # Single date by default. A from/to dispatch backfills a range
        # (holidays skipped); the rollup refresh below folds all of it in.
        run: |
          if [ -n "${{ github.event.inputs.from }}" ]; then
            tej-bazaar backfill \
              --from "${{ github.event.inputs.from }}" \
              --to "${{ steps.date.outputs.value }}" \
              --exchange both \
              --out-dir data/out
          else
            tej-bazaar fetch "${{ steps.date.outputs.value }}" \
              --exchange both \
              --out-dir data/out
          fi

      - name: Did anything trade today?
        # Holiday or bhavcopy not yet published: fetch writes nothing and
        # every publish step below plus the whole derived job is skipped.
        id: traded
        run: |
          if find data/out/nse data/out/bse -name '*.parquet' 2>/dev/null | grep -q .; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "No price parquet written for ${{ steps.date.outputs.value }}; holiday or not yet published."
          fi

      - name: Publish today's daily to R2
        # Idempotent (ETag-dedup). Uploads today's daily file; the refresh
        # step folds it into the year rollup and prunes the daily key.
        if: steps.traded.outputs.value == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tej-bazaar publish-r2 \
            --data-dir data/out \
            --bucket tej-bazaar

      - name: Refresh current-year rollup on R2
        # compact --refresh --from-r2 pulls the existing rollup + any daily
        # keys from R2, dedupes by (symbol, date), sorts by (symbol, date)
        # so DuckDB row-group stats prune ~99% of bytes on single-symbol
        # queries, and rewrites year=YYYY/<ex>_YYYY.parquet. Then the daily
        # keys are pruned so each year= prefix stays at exactly one parquet.
        # There is no separate year-end compaction: on Jan 2 the current
        # year flips and the prior year is left frozen as its rollup.
        if: steps.traded.outputs.value == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          YEAR="${{ steps.year.outputs.value }}"
          tej-bazaar compact --year "$YEAR" --exchange both \
            --from-r2 --refresh --bucket tej-bazaar
          tej-bazaar publish-r2 --data-dir data/out --bucket tej-bazaar
          for ex in nse bse; do
            tej-bazaar r2-prune --prefix "$ex/year=$YEAR/month=" \
              --bucket tej-bazaar --yes
          done
          # Drop the local dailies too: their rows now live in the rollup.
          # Otherwise the HF publish below would carry rollup AND dailies,
          # double-counting those dates for anyone who globs the year.
          rm -rf data/out/nse/year="$YEAR"/month=* data/out/bse/year="$YEAR"/month=*

      - name: Export edge JSON (ohlcv + snapshots)
        # Pull every year's rollup so per-symbol OHLCV JSON carries full
        # history, then pre-render the free-tier responses the Worker
        # serves straight from R2. ~11k small files; publish-r2 dedups by
        # ETag so only symbols that traded today are re-uploaded.
        if: steps.traded.outputs.value == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tej-bazaar pull-r2 --prefix nse/ --prefix bse/ \
            --data-dir data/out --bucket tej-bazaar
          tej-bazaar export-json \
            --prices-dir data/out --out-dir data/api --exchange both \
            --only ohlcv,snapshot \
            --snapshot-years "${{ github.event.inputs.snapshots || 'current' }}"
          tej-bazaar publish-r2 --data-dir data/api --bucket tej-bazaar

      - name: Publish prices to HF
        # data/out now holds only the current-year rollups. delete-pattern
        # converges the HF repo to rollup-only by removing stale dailies.
        if: steps.traded.outputs.value == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_XET: '1'
        run: |
          tej-bazaar publish \
            --repo tejhq/indian-markets \
            --data-dir data/out \
            --delete-pattern "nse/year=*/month=*" \
            --delete-pattern "bse/year=*/month=*" \
            --card hf/README.md \
            -m "daily: ${{ steps.date.outputs.value }} NSE+BSE prices"

      - name: Summary
        if: always()
        run: |
          {
            echo "## prices: ${{ steps.date.outputs.value }}"
            echo ""
            files=$(find data/out -name "*.parquet" 2>/dev/null | sort)
            if [ -n "$files" ]; then
              echo '```'; echo "$files"; echo '```'
            else
              echo "_No parquet written: holiday or bhavcopy not yet published._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  derived:
    needs: prices
    if: needs.prices.outputs.traded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pipeline
        run: pip install -e .

      - name: Pull price + actions history from R2
        # Inputs only, into data/out. Includes today's row because the
        # prices job already refreshed the rollup. Derived outputs go to
        # data/derived so only freshly built artifacts get published.
        run: |
          tej-bazaar pull-r2 \
            --prefix nse/ --prefix bse/ --prefix actions/ \
            --data-dir data/out --bucket tej-bazaar

      - name: Fetch corporate actions (YTD)
        # NSE's corp-actions website API is the one flaky source (anti-bot
        # header dance). Allowed to fail: adjust then runs on the actions
        # history pulled from R2 above, at most one day stale.
        id: actions
        continue-on-error: true
        run: |
          tej-bazaar actions fetch \
            --year "${{ needs.prices.outputs.year }}" \
            --exchange both \
            --cache-dir data/raw/actions \
            --out-dir data/derived/actions

      - name: Apply fresh actions, or discard partial output
        run: |
          if [ "${{ steps.actions.outcome }}" = "success" ]; then
            mkdir -p data/out/actions
            cp data/derived/actions/*.parquet data/out/actions/
          else
            echo "::warning::corp-actions fetch failed; adjusting with actions history from R2"
            rm -rf data/derived/actions
          fi

      - name: Build symbol history
        run: |
          tej-bazaar symbol-history build \
            --exchange both \
            --prices-dir data/out \
            --out-dir data/derived/symbol_history

      - name: Compute adjusted prices (all years)
        # All years, not YTD: a 2026 bonus retroactively rescales every
        # earlier adj_close for that ISIN.
        run: |
          tej-bazaar actions adjust \
            --all-years \
            --exchange both \
            --prices-dir data/out \
            --actions-dir data/out/actions \
            --out-dir data/derived/prices_adjusted

      - name: Build derived metrics (all years)
        run: |
          # --slices-dir lands under data/api so the month files go to R2
          # only (the step below publishes data/api), not to HuggingFace.
          tej-bazaar metrics build \
            --all-years \
            --exchange both \
            --adjusted-dir data/derived/prices_adjusted \
            --out-dir data/derived/metrics \
            --slices-dir data/api/metrics

      - name: Build liquidity universe (all years)
        run: |
          tej-bazaar universe build \
            --exchange both \
            --prices-dir data/out \
            --out-dir data/derived/universe

      - name: Publish derived to R2
        run: |
          tej-bazaar publish-r2 \
            --data-dir data/derived \
            --bucket tej-bazaar

      - name: Export edge JSON (actions)
        run: |
          tej-bazaar export-json \
            --prices-dir data/out --actions-dir data/out/actions \
            --out-dir data/api --only actions
          tej-bazaar publish-r2 --data-dir data/api --bucket tej-bazaar

      - name: Publish derived to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_XET: '1'
        run: |
          # delete-pattern drops the one-off date-range action files a
          # manual fetch once left beside the per-year files; they would
          # double count for anyone globbing actions/*.parquet.
          tej-bazaar publish \
            --repo tejhq/indian-markets \
            --data-dir data/derived \
            --delete-pattern "actions/*_????????_????????.parquet" \
            -m "daily: ${{ needs.prices.outputs.date }} actions + adjusted + symbol-history + metrics"

      - name: Summary
        if: always()
        run: |
          {
            echo "## derived: ${{ needs.prices.outputs.date }}"
            echo ""
            echo "corp-actions fetch: ${{ steps.actions.outcome }}"
            echo ""
            echo '```'; find data/derived -name "*.parquet" 2>/dev/null | sort; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  alert:
    # Optional webhook (Discord/Slack-compatible JSON). GitHub already emails
    # the workflow's last committer on scheduled-run failure; this is extra.
    needs: [prices, derived]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post failure
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "ALERT_WEBHOOK_URL not set; skipping webhook"; exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' "$WEBHOOK" -d @- <<JSON
          {"content":"tej-bazaar daily FAILED for ${{ needs.prices.outputs.date }}: prices=${{ needs.prices.result }} derived=${{ needs.derived.result }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          JSON
