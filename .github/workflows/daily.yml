name: daily-bhavcopy

on:
  schedule:
    # 14:30 UTC = 20:00 IST, Mon-Fri. NSE bhavcopy lands ~18:00 IST,
    # BSE ~18:30 IST. 20:00 IST gives a 90-min buffer in case the
    # archives endpoint lags or NSE delays publication.
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Trading date YYYY-MM-DD (defaults to today UTC→IST)'
        required: false
        default: ''

concurrency:
  group: daily-bhavcopy
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pipeline
        run: pip install -e .

      - name: Resolve trading date (IST)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            D="${{ github.event.inputs.date }}"
          else
            D=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          fi
          echo "value=$D" >> "$GITHUB_OUTPUT"
          echo "Trading date: $D"

      - name: Fetch NSE+BSE
        run: |
          tej-bazaar fetch "${{ steps.date.outputs.value }}" \
            --exchange both \
            --out-dir data/out

      # Note: there is no separate year-end compaction step. The
      # "Refresh current-year rollup" step below runs every weekday and
      # keeps each year as a single rollup parquet at all times. On Jan 2
      # the current year flips to the new one, naturally leaving the prior
      # year frozen as its already-compacted rollup.

      - name: Resolve current year (IST)
        id: year
        run: echo "value=$(TZ=Asia/Kolkata date +%Y)" >> "$GITHUB_OUTPUT"

      - name: Pull price + actions history from R2
        # Seeds the runner with full history BEFORE the all-years derived
        # steps below. A fresh runner otherwise holds only today's fetch,
        # so symbol-history / adjust / metrics would collapse to one day
        # of data and overwrite the full-history artifacts on R2.
        # Local-wins: today's freshly fetched files are never clobbered.
        # Derived prefixes (prices_adjusted/, symbol_history/, metrics/)
        # are NOT pulled — they are rebuilt from scratch every run.
        # Gated on today's fetch producing price files so holidays keep
        # skipping the whole publish tail via the hashFiles guards below.
        if: ${{ hashFiles('data/out/nse/**/*.parquet', 'data/out/bse/**/*.parquet') != '' }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tej-bazaar pull-r2 \
            --prefix nse/ --prefix bse/ --prefix actions/ \
            --data-dir data/out --bucket tej-bazaar

      - name: Fetch corporate actions (YTD)
        # YTD rolling refresh: overwrites annual <exchange>_<year>.parquet so
        # the published file stays a single per-year artifact.
        continue-on-error: true
        run: |
          tej-bazaar actions fetch \
            --year "${{ steps.year.outputs.value }}" \
            --exchange both \
            --cache-dir data/raw/actions \
            --out-dir data/out/actions

      - name: Build symbol history
        # Walks all bhavcopy years on disk and emits per-ISIN symbol intervals.
        # Standalone artifact for downstream consumers (e.g. tej-api). The
        # `actions adjust` step uses the same algorithm in-memory from the
        # price series it already loads, so this step is independent of
        # adjust and can run in any order around it.
        continue-on-error: true
        run: |
          tej-bazaar symbol-history build \
            --exchange both \
            --prices-dir data/out \
            --out-dir data/out/symbol_history

      - name: Compute adjusted prices (all years)
        # Joins bhavcopy + actions into back-adjusted prices for EVERY year
        # on disk. All-years (not YTD) because a future bonus / split makes
        # past adjusted closes stale: a 2026 1:1 bonus retroactively halves
        # the 2024 adj_close for that ISIN. Depends on the symbol-history
        # step above for ISIN resolution.
        continue-on-error: true
        run: |
          tej-bazaar actions adjust \
            --all-years \
            --exchange both \
            --prices-dir data/out \
            --actions-dir data/out/actions \
            --out-dir data/out/prices_adjusted

      - name: Build derived metrics (all years)
        # Returns + rolling 52w/20d/60d windows. Reads adjusted parquet,
        # writes data/out/metrics/<ex>_<year>.parquet. Always full history
        # so rolling windows are seeded; output filtered per-year.
        continue-on-error: true
        run: |
          tej-bazaar metrics build \
            --all-years \
            --exchange both \
            --adjusted-dir data/out/prices_adjusted \
            --out-dir data/out/metrics

      - name: Publish to R2
        # Primary serving path for tej-api. Idempotent (ETag-dedup), so a
        # rerun on the same date is cheap. Runs before HF because the API
        # depends on R2 freshness. Today's freshly-fetched daily file is
        # uploaded here; the next step folds it into the year rollup and
        # the prune-step after that deletes the now-redundant daily key.
        if: ${{ hashFiles('data/out/**/*.parquet') != '' }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tej-bazaar publish-r2 \
            --data-dir data/out \
            --bucket tej-bazaar

      - name: Refresh current-year rollup
        # Re-rolls the current year's `<ex>_<YYYY>.parquet` so today's row
        # is folded in alongside the previously-compacted rows. Then deletes
        # the now-redundant daily R2 keys for the current year. Without
        # this, year=YYYY/ accumulates 250+ daily files by year end, which
        # explodes R2 LIST cost on tej-api OHLCV queries. compact --refresh
        # pulls BOTH the existing rollup and any daily keys from R2, dedupes
        # by (symbol, date), and sorts by (symbol, date) so DuckDB row-group
        # stats let single-symbol queries skip ~99% of bytes.
        if: ${{ hashFiles('data/out/**/*.parquet') != '' }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          YEAR=$(TZ=Asia/Kolkata date +%Y)
          tej-bazaar compact --year "$YEAR" --exchange both \
            --from-r2 --refresh --bucket tej-bazaar
          tej-bazaar publish-r2 --data-dir data/out --bucket tej-bazaar
          for ex in nse bse; do
            tej-bazaar r2-prune --prefix "$ex/year=$YEAR/month=" \
              --bucket tej-bazaar --yes
          done
          # Drop the now-redundant LOCAL daily files too (today's fetch +
          # any pulled from R2): their rows are folded into the rollup
          # above. Without this the HF mirror below would carry both the
          # rollup AND the dailies, double-counting those dates for any
          # consumer that globs the whole year.
          rm -rf data/out/nse/year="$YEAR"/month=* data/out/bse/year="$YEAR"/month=*

      - name: Publish to HF
        # Gate on PRICE files specifically, not any parquet: on a holiday
        # the YTD actions fetch still writes a parquet, but the pull step
        # is skipped, so local data/out has no nse/ bse/ rollups. Running
        # the HF publish then would fire delete-patterns against the
        # dailies on HF with nothing local to replace them.
        if: ${{ hashFiles('data/out/nse/**/*.parquet', 'data/out/bse/**/*.parquet') != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_XET: '1'
        run: |
          # delete-patterns: local data/out holds rollup-per-year only (the
          # refresh step above folded + removed dailies), so any daily file
          # still on HF is stale and double-counts its date. Deleting the
          # month= globs converges the HF repo to the rollup layout.
          tej-bazaar publish \
            --repo tejhq/indian-markets \
            --data-dir data/out \
            --delete-pattern "nse/year=*/month=*" \
            --delete-pattern "bse/year=*/month=*" \
            -m "daily: ${{ steps.date.outputs.value }} NSE+BSE + actions + adjusted + symbol-history + metrics"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Daily run — ${{ steps.date.outputs.value }}"
            echo ""
            files=$(find data/out -name "*.parquet" 2>/dev/null | sort)
            if [ -n "$files" ]; then
              echo "Parquet files written:"
              echo '```'
              echo "$files"
              echo '```'
            else
              echo "_No parquet written — likely a holiday or bhavcopy not yet published._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
